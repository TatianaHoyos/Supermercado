spring.application.name=ApiSupermercado

# ==========================
# Configuraciones de JPA + MySQL
# ==========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/supermarket}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${DB_PLATFORM:org.hibernate.dialect.MySQL8Dialect}
server.port=8080
